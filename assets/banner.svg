<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 10, 15;
        animation: dash 20s linear infinite;
      }
      .node-float {
        animation: float 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.4; }
        50% { r: 14px; opacity: 0.9; filter: drop-shadow(0 0 8px #58a6ff); }
        100% { r: 6px; opacity: 0.4; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  
  <!-- Grid Lines / Dynamic Background Network -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Animated Network Connections (Background Edge Nodes) -->
  <path d="M 150,300 Q 300,100 600,200 T 1050,100" fill="none" stroke="url(#line-grad)" stroke-width="2" class="dash-line" />
  <path d="M 100,100 Q 400,350 800,120 T 1100,320" fill="none" stroke="url(#line-grad)" stroke-width="2" class="dash-line" style="animation-direction: reverse;" />

  <!-- Animated Edge Nodes -->
  <g class="node-float">
    <circle cx="150" cy="300" r="8" fill="#58a6ff" class="pulse-circle" />
    <circle cx="600" cy="200" r="10" fill="#bc8cff" class="pulse-circle" style="animation-delay: 1s;" />
    <circle cx="1050" cy="100" r="8" fill="#3fb950" class="pulse-circle" style="animation-delay: 2s;" />
    <circle cx="400" cy="320" r="6" fill="#58a6ff" class="pulse-circle" style="animation-delay: 0.5s;" />
    <circle cx="800" cy="120" r="9" fill="#bc8cff" class="pulse-circle" style="animation-delay: 1.5s;" />
  </g>

  <!-- Dark Overlay for Center Text Visibility -->
  <rect x="150" y="80" width="900" height="240" fill="#0d1117" fill-opacity="0.75" rx="20" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#text-grad)" filter="url(#glow)">
      Awesome Content Delivery Network (CDN) 🌍 🚀
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8b949e">
      Curated Directory of Commercial Edge Platforms &amp; Open-Source Caching Tools
    </text>

    <!-- Category Pills / Badges in Foreground -->
    <g transform="translate(600, 275)">
      <!-- Pill 1 -->
      <rect x="-260" y="-18" width="160" height="32" rx="16" fill="#21262d" stroke="#58a6ff" stroke-width="1.5" />
      <text x="-180" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#58a6ff">⚡ Edge Caching</text>
      
      <!-- Pill 2 -->
      <rect x="-85" y="-18" width="170" height="32" rx="16" fill="#21262d" stroke="#bc8cff" stroke-width="1.5" />
      <text x="0" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#bc8cff">🛡️ DDoS Mitigation</text>
      
      <!-- Pill 3 -->
      <rect x="100" y="-18" width="160" height="32" rx="16" fill="#21262d" stroke="#3fb950" stroke-width="1.5" />
      <text x="180" y="3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#3fb950">🔓 Open-Source</text>
    </g>
  </g>
</svg>
